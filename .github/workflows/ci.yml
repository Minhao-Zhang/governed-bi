name: CI

# Lint, types, tests, and the data-free leak check. The UI is a second job.
on:
  push:
    branches: [main, v2]
  pull_request:
  workflow_dispatch:

jobs:
  # The engine. The leak check walks named roots and does not read TypeScript,
  # so a broken frontend cannot hide a broken engine.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A pull_request checkout has no `main`. Provenance needs one commit of it;
      # faking the sha would hide the knob the test exists for.
      - name: Fetch main for provenance
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      # `--frozen` tests the lockfile. `--extra bedrock` imports botocore, which the
      # provider-translation tests need; without it they pass on a machine that synced
      # the extra and fail here.
      - name: Sync (frozen)
        run: uv sync --frozen --extra bedrock

      - name: Lint
        run: uv run --frozen ruff check .

      # The whole package, kept at zero errors: a new finding fails the build rather than
      # joining a backlog.
      - name: Types
        run: uv run --frozen mypy src/governed_bi

      # Needs no corpus and no dataset. `tools/check_train_only.py` is the other half
      # and is not here: it needs a corpus, the held-out question file, and a control.
      - name: Gate — no benchmark discriminators in the tree
        run: uv run --frozen python tools/check_no_benchmark_discriminators.py

      # `-rs` prints every skip with its reason. Postgres and OpenAI tests skip without
      # credentials, and a silent skip would hide which adapter ran.
      - name: Tests
        run: uv run --frozen pytest -q -rs

  # The frontend. Added when the UI stopped being a sibling repository and became `ui/`: while it
  # was separate it had CI of its own, and folding it in without this job would have quietly
  # deleted that — the merge would have *removed* checks while appearing to consolidate them.
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # `npm ci` fails when the lockfile disagrees, instead of rewriting it.
      - name: Install (frozen)
        run: npm ci

      # High, production dependencies only. Unfixed moderate advisories in dev tooling
      # would keep this red with nothing to merge. Dependabot raises the pin.
      - name: Audit
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      # Not redundant with the linter. ESLint here does not type-check, so an engine payload
      # field renamed on the Python side passes lint and fails only in a browser.
      - name: Types
        run: npx tsc --noEmit

      # Component tests for the chat, answer-card and clarification surfaces a first user touches.
      # They drive the real transport hook against a stubbed `useStream`, so they need no engine.
      - name: Tests
        run: npm test

      # A production build, which exercises what neither of the above does: the App Router's own
      # constraints. It needs no engine and no corpus — with `NEXT_PUBLIC_LANGGRAPH_URL` unset the
      # app renders from `lib/mock/fixtures.ts`, so the build is hermetic.
      - name: Build
        run: npm run build

      # `npm run check:stream-messages` is deliberately NOT here: it is a red/green reproduction
      # of one rendering bug rather than a gate. `docs/usage.md` names it as manual.
