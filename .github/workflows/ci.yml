name: CI

# Enforce the PR-gated governance narrative the docs describe: corpus validation
# (D9) + the full test suite must pass on every push/PR. The deterministic core
# runs offline (no OpenAI key, no network); all deps live in core (no
# optional-dependency extras), so the LangGraph-equivalence and HTTP-API tests RUN
# here rather than being silently skipped.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      # All deps live in core (no optional-dependency extras), so a plain sync
      # installs the LangGraph/deepagents/LangChain harnesses + FastAPI — which is
      # what makes the LangGraph-equivalence and HTTP-API tests execute instead of
      # `importorskip`-skipping.
      - name: Sync (all deps)
        run: uv sync

      # The governed end-to-end tests execute against the committed BIRD database.
      # Fail loudly if it is ever removed, rather than letting the highest-value
      # integration tests silently skip (the reproducible-demo gap a review flagged).
      - name: Require the committed demo database
        run: test -f data/bird/beer_factory.sqlite

      # Corpus validation is the curator's "done-enough" gate (D9): ID conventions
      # + reference integrity across every db under corpus/.
      - name: Validate corpus
        run: uv run python -m governed_bi.corpus.cli

      # Lint gates the whole tree (AUDIT T5). Config in [tool.ruff]; keep it green
      # rather than widening `select` ahead of a cleanup pass.
      - name: Lint (ruff)
        run: uv run ruff check .

      # Type-checking gates the governance spine only — the modules that decide
      # whether a query executes. A whole-tree gate would need ~90 fixes first, and
      # an unenforceable gate is what AUDIT T5 was about. Widen this list as files
      # are typed; never widen it past what stays green.
      #
      # The eval trio is gated for the same reason as the gateway files: they decide
      # whether a run's numbers are comparable and quotable, so a wrong type there
      # corrupts a published figure instead of crashing. Verified clean before being
      # added here.
      - name: Type-check (mypy, governance spine)
        run: >-
          uv run mypy
          src/governed_bi/gateway/guardrails.py
          src/governed_bi/gateway/gateway.py
          src/governed_bi/gateway/connectors/postgres.py
          src/governed_bi/analyst/governance.py
          src/governed_bi/analyst/answer.py
          src/governed_bi/analyst/middleware.py
          src/governed_bi/eval/metrics.py
          src/governed_bi/eval/harness.py
          src/governed_bi/eval/split_gap.py
          src/governed_bi/eval/atomic.py

      # docs/eval-metrics.md is GENERATED from the metric register and claims in its
      # own header that it cannot drift. The pytest covering it only greps for field
      # names in backticks, so a changed denominator, a wrong count, or a phantom
      # table row all stay green — and the count was in fact wrong (said 80, register
      # declared 86) when this step was added. `--check` regenerates in memory and
      # fails on any byte difference, which is the only version of "cannot drift"
      # that is actually true. Writes nothing; fix by re-running without --check.
      - name: Check generated docs are current (eval metrics)
        run: uv run python scripts/gen_eval_metrics_doc.py --check

      # docs/openapi.json is a cross-repo contract: the frontend (../governed-bi-ui)
      # is built against it. It had no generator and no check, and had already
      # drifted — two mutating routes were missing their auth headers, so a client
      # written from the doc would call a gated API unauthenticated. Same `--check`
      # semantics; runs offline with no OPENAI_API_KEY, which CI does not have.
      - name: Check the OpenAPI contract is current
        run: uv run python scripts/export_openapi.py --check

      # -rs surfaces skip reasons. --strict-markers + ResourceWarning visibility
      # come from [tool.pytest.ini_options] in pyproject.toml (AUDIT T5).
      - name: Run tests
        run: uv run pytest -q -rs
