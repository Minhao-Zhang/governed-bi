name: CI

# **Rewritten 2026-08-04, because the previous job could not pass and therefore ran nothing
# that mattered.** It linted nine paths that do not exist (`gateway/guardrails.py`,
# `analyst/governance.py`, `eval/metrics.py` and six more — all deleted with v1), invoked
# `governed_bi.corpus.cli` and two scripts under a `scripts/` directory that does not exist.
# The job failed at step 4, so `uv run pytest` — the **only** caller of the five `tools/`
# gates — never executed.
#
# That is the difference between a broken CI and a misleading one: ADR 0005 §6 calls the
# file-length limit "CI-enforced", and that sentence was false for the whole life of the
# branch. A gate nobody runs is a preference, which is the argument
# `tools/check_file_length.py` makes about itself in its own docstring.
#
# Everything below is a step that runs against the tree as it exists. Nothing here asserts a
# file that is not present, and nothing is skipped silently: the suite prints its skips with
# `-rs`, and the parcel register reports built-but-unaccepted packages on every run.
on:
  push:
    branches: [main, v2]
  pull_request:
  # Nightly, for the `mutate` job at the bottom of this file and for nothing else. GitHub only
  # runs a schedule from the default branch, so what it measures is `main` — which is the right
  # population for a mutation run, because the question it asks is whether the tests guarding
  # shipped invariants can still fail. The two jobs above run on this trigger too; that is
  # harmless and cheaper than teaching each of them to opt out.
  schedule:
    - cron: "0 7 * * *"

jobs:
  # The Python engine: everything under `src`, `tools`, `tests` and `docs`. None of
  # the gates below can see `ui/` — they walk named roots and none of them reads TypeScript — so
  # the frontend is a second job rather than three more steps here. Two jobs also means a broken
  # frontend does not hide a broken engine behind a single red X.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      # `--frozen` on purpose: a CI run that re-resolves the lockfile is not testing the
      # dependency set anyone else has. It is also what every command in this repo's own
      # docs uses, so CI and a developer's shell agree.
      #
      # `--extra bedrock` because the provider translation is pure Python and is exactly the
      # code that fails silently: `max_retries` handed to a boto client is accepted and
      # ignored, so an arm records a retry budget it does not honour. Testing it needs
      # `botocore.config.Config` importable and costs no AWS call. Without the extra those
      # tests raised ModuleNotFoundError here while passing on a developer machine that had
      # run `uv sync --extra bedrock` — CI and the shell disagreeing, which is the one thing
      # `--frozen` is here to prevent.
      - name: Sync (frozen)
        run: uv sync --frozen --extra bedrock

      - name: Lint
        run: uv run --frozen ruff check .

      # The five gates ADR 0005 §6 declares. Run explicitly as well as through the
      # conformance suite: the suite asserts they *exit zero on a clean tree*, and running
      # them directly is what makes their output visible in the log when they do not.
      #
      # **`check_citations` was the fifth and was missing here** until 2026-08-06: the register
      # named five gates, this file ran four, and the one absent was the one that fails when a
      # retired number reappears in live code. Adding it is what makes the previous commit's
      # retirement of `EX was 0.049` enforced rather than recorded.
      - name: Gate — file length (soft 400, hard 1000)
        run: uv run --frozen python tools/check_file_length.py

      - name: Gate — one implementation per concept
        run: uv run --frozen python tools/check_one_implementation.py

      - name: Gate — measurement locality
        run: uv run --frozen python tools/check_measurement_locality.py

      - name: Gate — import layering
        run: uv run --frozen python tools/check_imports.py

      - name: Gate — no retired claims in live code
        run: uv run --frozen python tools/check_citations.py

      # Corpus contamination, source level. Needs no corpus and no dataset, which is why it
      # can run here at all: it refuses the two tables of hand-authored sibling discriminators
      # that were written by reading the held-out questions, and the shape they were written in.
      #
      # `tools/check_train_only.py` is the other half and deliberately is NOT here. It needs a
      # corpus tree (untracked), the held-out question file (a separate repository) and a third
      # corpus certified train-only. Naming it as a CI gate would be the "CI-enforced" claim
      # this file's header is about. It is a manual gate; its preconditions are in its docstring.
      - name: Gate — no benchmark discriminators in the tree
        run: uv run --frozen python tools/check_no_benchmark_discriminators.py

      # The adversarial governance suite, **printed**. This is not a sixth gate and is not
      # registered as one: the build-failing half of the property already runs under `pytest`,
      # in `tests/govern/test_adversarial_suite.py`, which reads the same
      # `src/governed_bi/govern/adversarial.toml` this driver reads — one suite, two callers,
      # rather than two lists that drift.
      #
      # What the step buys is the same thing the five gates above buy by being run explicitly:
      # the numbers land in the build log instead of only inside an assertion that passed.
      # Bypass, misattribution, false refusal, guardrail error and per-layer recall each print
      # with their denominator, so a reader of a green build can see *what* governance bought
      # rather than only that a test agreed it bought something. It costs no credential, no
      # network and no model call, and the layer stack is deterministic, so two runs of it are
      # identical — which is why it can sit on every push at all.
      #
      # It exits 1 on any suite failure, so a broken tree fails here rather than in `pytest`
      # below: the same defect, one step earlier, with the rates beside it.
      - name: Report — adversarial governance rates
        run: uv run --frozen python tools/govern_bench.py

      # `-rs` prints every skip with its reason. That is not cosmetic here: the Postgres and
      # OpenAI-backed contracts skip without credentials, and a silent skip turns "we tested
      # one adapter" into "we tested two" — the exact failure `tests/embedders.py` documents.
      # CI has neither credential, so those skips are expected and must stay legible.
      - name: Tests
        run: uv run --frozen pytest -q -rs

      # Reports which packages have code but no sign-off. Never fails the build: the
      # three-state parcel model in `tests/contracts.py` treats "built and unaccepted" as a
      # reportable state, not an error, because acceptance is a person's judgement.
      - name: Parcel acceptance report
        run: |
          uv run --frozen python -c "
          import sys; sys.path.insert(0, 'tests')
          import contracts as c
          print('accepted           :', sorted(c.ACCEPTED))
          print('built, unaccepted  :', sorted(c.built_but_unaccepted()))
          print('declared, unbuilt  :', sorted(c.unbuilt()))
          "

  # The frontend. Added when the UI stopped being a sibling repository and became `ui/`: while it
  # was separate it had CI of its own, and folding it in without this job would have quietly
  # deleted that — the merge would have *removed* checks while appearing to consolidate them.
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # `npm ci` and not `npm install`, for the same reason the job above pins `uv --frozen`: an
      # install that re-resolves is not testing the dependency set anyone else has. It also fails
      # loudly when package.json and the lockfile disagree, which they did at the moment of the
      # merge (three missing optional `@emnapi/*` entries under sharp's wasm fallback) and which
      # `npm install` would have papered over by rewriting the lockfile inside CI.
      - name: Install (frozen)
        run: npm ci

      - name: Lint
        run: npm run lint

      # Not redundant with the linter. ESLint here does not type-check, so an engine payload
      # field renamed on the Python side passes lint and fails only in a browser. This is the
      # same defect class `npm run check:api` catches, one stage earlier and with no engine
      # needed — which is the whole reason it can run here and `check:api` cannot.
      - name: Types
        run: npx tsc --noEmit

      # A production build, which exercises what neither of the above does: the App Router's own
      # constraints. It needs no engine and no corpus — with `NEXT_PUBLIC_LANGGRAPH_URL` unset the
      # app renders from `lib/mock/fixtures.ts`, so the build is hermetic.
      - name: Build
        run: npm run build

      # A closure gate, not a reproduction: every `CATALOG_GLIMPSE_REFUSALS` member must have a
      # `REFUSED_BY_SENTENCE` entry, or a refusal renders as a bare catalog with no sentence. It
      # imports `lib/answer-delivery.ts` and nothing else — no engine, no corpus, no network — so
      # it belongs here. Unwired until 2026-08-22 only because the change that added the script
      # was not allowed to touch `package.json`, which left the check with no runner at all.
      - name: Answer-delivery closure
        run: npm run check:answer-delivery

      # The word diff a reviewer reads before deciding whether a change to the semantic layer is
      # right. It is a *minimality* gate: a diff that marks a whole sentence changed when one word
      # moved still renders and still looks like a diff, so the degradation is silent. Imports
      # `lib/asset-diff.ts` and nothing else.
      - name: Asset-diff minimality
        run: npm run check:asset-diff

      # `npm run check:api` and `npm run check:stream-messages` are deliberately NOT here.
      # `check:api` needs a live engine and a loaded corpus (ADR 0009 says so in the section that
      # introduces it); `check:stream-messages` is pure and could run, but it is a red/green
      # reproduction of one screenshot bug rather than a gate, and it asserts against fixtures it
      # ships with. Both are named in `docs/usage.md` as manual.

  # Mutation testing. **Nightly, and deliberately not on a push.** `tools/mutate.py`'s own
  # docstring gives the reason: it runs a pytest selection per declared mutation, so it is slow,
  # and it "belongs on a nightly or a pre-release run rather than on every push". That is also
  # why it is not named `check_*` — `tests/conformance/test_register_closure.py` requires every
  # `tools/check_*.py` to be declared CI or declared manual, and this is a third thing.
  #
  # What it proves is narrow and worth having: for each entry in `tools/mutation_catalogue.py`,
  # that the anchor still exists (so the entry has not gone stale against a refactor), that the
  # mutated tree makes at least one named test fail, and that the tree is restored. It says
  # nothing about mutations nobody wrote down.
  #
  # **It rewrites source files in place and restores them**, in a `finally`, with the restore
  # verified byte-for-byte before the next mutation runs — deliberately not via
  # `git checkout --`, so that it is safe on a dirty tree. The consequence is that it must never
  # run beside anything else reading the same checkout: for the length of one mutation, `src/`
  # on disk holds a deliberate defect, and a concurrent reader would see it. On hosted runners
  # each job gets its own workspace, so the two jobs above cannot; on a self-hosted runner
  # sharing one, they could. The concurrency group below is what stops two of these overlapping,
  # and the `if` is what keeps it off pushes.
  mutate:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: mutate-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Sync (frozen)
        run: uv sync --frozen --extra bedrock

      - name: Mutation testing (every declared mutation)
        run: uv run --frozen python tools/mutate.py
