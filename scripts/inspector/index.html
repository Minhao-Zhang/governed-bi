<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Experiment inspector · governed-bi</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <a class="skip-link" href="#turn-list">Skip to results</a>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">◧</span>
      <div>
        <h1>Experiment inspector</h1>
        <p class="brand-sub" id="db-path" title="database file"></p>
      </div>
    </div>
    <div class="topbar-controls">
      <label class="field">
        <span class="field-label">Run</span>
        <select id="run-select" aria-label="Select run"></select>
      </label>
      <div id="capabilities" class="cap-badges" aria-live="polite"></div>
    </div>
  </header>

  <section id="overview" class="overview" aria-label="Run overview" hidden>
    <div class="overview-head">
      <h2>Overview</h2>
      <button id="overview-toggle" class="link-btn" aria-expanded="true" aria-controls="overview-body">Hide</button>
    </div>
    <div id="overview-body" class="overview-body">
      <div id="run-meta" class="run-meta"></div>
      <div id="run-notes" class="run-notes" aria-live="polite"></div>
      <div class="table-wrap">
        <table id="arm-table" class="metric-table">
          <caption class="sr-only">Per-arm metrics</caption>
          <thead>
            <tr>
              <th scope="col">Arm</th>
              <th scope="col" class="num">Turns</th>
              <th scope="col" class="num">Graded</th>
              <th scope="col" class="num">Correct</th>
              <th scope="col" class="num">EX</th>
              <th scope="col" class="num">Crashed</th>
              <th scope="col" class="num">Pick hit</th>
              <th scope="col" class="num">Routed hit</th>
              <th scope="col" class="num">Avg latency</th>
              <th scope="col" class="num">Tokens</th>
              <th scope="col" class="num">Cost (USD)</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </section>

  <section class="filters" aria-label="Filters">
    <label class="field">
      <span class="field-label">Arm</span>
      <select id="filter-arm"><option value="">All</option></select>
    </label>
    <label class="field">
      <span class="field-label">Schema (db)</span>
      <select id="filter-db"><option value="">All</option></select>
    </label>
    <label class="field">
      <span class="field-label">Outcome</span>
      <select id="filter-outcome"><option value="">All</option></select>
    </label>
    <label class="field">
      <span class="field-label">Verdict</span>
      <select id="filter-verdict">
        <option value="">All</option>
        <option value="pass">Pass</option>
        <option value="fail">Fail</option>
        <option value="ungraded">Ungraded</option>
      </select>
    </label>
    <label class="field field-grow">
      <span class="field-label">Search</span>
      <input id="filter-search" type="search" placeholder="question id, text, SQL, db, error…"
             autocomplete="off" spellcheck="false" />
    </label>
    <button id="filter-reset" class="btn-secondary" type="button">Reset</button>
  </section>

  <main class="workspace">
    <section class="list-pane" aria-label="Turns">
      <div class="list-head">
        <span id="list-count" class="list-count" aria-live="polite">—</span>
        <div class="pager">
          <button id="page-prev" class="btn-secondary" type="button" disabled>‹ Prev</button>
          <span id="page-info" class="page-info"></span>
          <button id="page-next" class="btn-secondary" type="button" disabled>Next ›</button>
        </div>
      </div>
      <div class="table-wrap list-scroll" id="turn-list" tabindex="-1">
        <table class="turn-table">
          <thead id="turn-head"></thead>
          <tbody id="turn-body"></tbody>
        </table>
        <div id="list-status" class="pane-status"></div>
      </div>
    </section>

    <section class="detail-pane" id="detail-pane" aria-label="Turn detail" aria-live="polite">
      <div class="pane-status detail-empty" id="detail-empty">
        <p>Select a turn to inspect its trajectory.</p>
      </div>
      <div id="detail-body" hidden></div>
    </section>
  </main>

  <div id="global-status" class="global-status" role="status" aria-live="polite" hidden></div>

  <script src="/static/app.js" defer></script>
</body>
</html>
