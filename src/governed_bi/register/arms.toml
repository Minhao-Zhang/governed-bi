# Arm profiles: what each measured arm changed, declared where a reader can diff it.
#
# An arm's identity used to live in a gitignored `.env` on one machine, which is the
# "versioned is not rebuildable" problem wearing a different hat: `runs/eval/` names an arm,
# and nothing committed said what that name meant. This file is the committed half.
#
# `treatment` is the load-bearing field. `eval/report.py::knobs_comparable` refuses a pair that
# cannot name what changed, because "nobody said what changed" is not "nothing changed" — that
# is audit D9's resolution, and this is where the caller says it. Every name must be a
# `Role.comparability` knob in `register/knobs.py`; `register/arm_profiles.py` refuses the file
# otherwise rather than silently ignoring a typo.
#
# This file does NOT set knobs. It declares what an arm's treatment *was*, so a recorded run can
# be checked against it. Adding a second place that decides a knob's value is the defect
# AGENTS.md names; the knob register stays the one home.
#
# `corpus` and `corpus_content_hash` are two different identifiers and both are here on purpose.
# `corpus` is the ref a human checks out in `../BIRD-corpus`; `corpus_content_hash` is the digest
# every measurement row carries, and is the only one `reconcile` can compare. Comparing the git
# ref against the recorded digest with `startswith` is what `reconcile` used to do, and it could
# never match — so the check returned agreement on every artifact ever produced.
#
# `corpus_content_hash` is **mandatory** on every arm. `register/arm_profiles.py` refuses this
# file without it, because the alternative is the failure that outlived the first fix: v3_fold —
# the baseline v4 is measured against — declared no digest, so `reconcile` skipped its only
# comparison and the driver printed "every row agrees with the profile in arms.toml" from a check
# that examined nothing. An arm that cannot be reconciled must say so, not report agreement.
#
# `dataset` and `question_subset` are the same two-identifier split, one field over, and they are
# here because this file enforced the rule above for the corpus **completely and for the question
# set not at all**. Found 2026-08-14 by a downstream fork that needed to know which questions the
# three arms below ran and could not read it anywhere: it recovered the answer by filtering four
# historical versions of `BIRD-Data-Obfuscation:eval_dataset/test_final.jsonl` against the 57
# schemas `BIRD-corpus@30872d3` covers and cross-checking the surviving candidate against prose in
# `docs/failure-modes.md`. That is a schema-filtered count across four repository versions to
# recover one fact; it should have been one field. Until it was, a rerun on a *replaced* dataset
# produced the same n = 1 351, a substantially different question population, and passed every
# quotability gate — because the gates compare the corpus digest and the knobs, and both matched.
#
# `dataset` is the ref a human checks out in `../BIRD-Data-Obfuscation`; `question_subset` is what
# a measurement row carries, and is the only one `reconcile` can compare. Same relationship as
# `corpus` to `corpus_content_hash`, deliberately, so a reader learns the shape once.
#
# `question_subset` is **mandatory** for the reason `corpus_content_hash` is: an optional field
# that silences a check is a check with an off switch nobody labelled. Its value is verbatim what
# the `question_subset` scope knob records — `"<count>:<12 hex of sha256 over the sorted question
# ids>"`, resolved by `eval/provenance.py::scope_identity`. The profile field carries the knob's
# *name* as well as its format so that the corpus defect cannot recur here: comparing two
# identifiers from two namespaces is what made `reconcile` vacuous, and one name in one format
# cannot be confused with a git ref.
#
# **What a question-id digest cannot detect**, stated because a gate whose blind spot is unwritten
# gets read as covering it: a dataset that edited a question's text, its evidence, or its gold SQL
# while keeping the ids is invisible to this field. `1711248` → `22fe2a6` moved ids, so this field
# would have caught it; a gold correction in place would not move it. `gold_fingerprint`
# (`eval/datalake.py::attach_gold_fingerprints`) is the field for that, and this one does not
# subsume it. Twelve hex characters is 48 bits, sized for drift between two attempts at one run
# and not against an adversary who wants a collision.
#
# **And this is a per-arm declaration, not a cross-arm gate.** `eval/report.py::knobs_comparable`
# compares `comparability_keys()`, and `question_subset` is `Role.scope`, so nothing stops two
# arms measured on two question sets from both being quotable. What the field buys is that each
# arm's rows are now checked against a claim a reader can diff, so such a pair has to say so here.
#
# ── two digests, one tree: why the four measured arms and the three planned ones differ ──
#
# The four measured arms below declare `86ed1dbf…` and the three planned arms declare
# `6e5c7b4b…`, and they are the same 57 schemas. **Measured 2026-08-26**, in a `git archive`
# extraction of each commit so neither checkout was disturbed:
#
#   corpus_content_hash('../BIRD-corpus')                        @30872d3  86ed1dbf…
#   corpus_content_hash('../BIRD-corpus')                        @74ff80c  6e5c7b4b…
#   corpus_content_hash('../BIRD-corpus', schemas=<the 57 dirs>) @30872d3  5a556b3c…
#   corpus_content_hash('../BIRD-corpus', schemas=<the 57 dirs>) @74ff80c  5a556b3c…
#
# The two commits between those refs add `LICENSE` and `README.md` and touch no asset.
# `corpus/hash.py::corpus_content_hash` digests every file in the selected subtrees and
# `corpus/identity.py::_is_tooling` drops tool-owned *directories* only — its docstring is
# explicit that a root `README.md` is deliberately **not** dropped — so the whole-tree digest
# moved while the assets did not. That is what `docs/return-path.md` means by "`--arm v4`
# against the checked-out tip is refused today", and the refusal is **correct**: v4's 1 351 rows
# carry `86ed1dbf…`, and re-pointing that field at a tree v4 never ran on is the silent
# relabelling `tests/conformance/test_arm_profiles_are_declared.py::
# test_the_shipped_profiles_name_the_digest_their_artifacts_carry` exists to fail on. An arm
# re-run on today's tree is a NEW arm, and that is `v4_live` below.
#
# **The durable fix is the third line of that table and it is not in this file.** Restricting the
# digest to the schema subtrees makes it invariant across a commit that adds only non-asset
# files, and it is a parameter of the one implementation rather than a second one —
# `corpus/hash.py`'s own docstring says so ("A parameter here rather than a second function,
# because two digest implementations is how two answers to 'is this the same corpus' come to
# disagree"). What is missing is that the value a row *carries* comes from
# `serve/session.py::from_corpus_dir`, and the eval driver is the one caller that can never pass
# a manifest: `serve/__main__.py` passes one always and `api/graph_app.py` whenever a schema is
# pinned, while the driver derives its 57 schemas from the loaded structure — *after* the digest
# is taken. `corpus/identity.py::corpus_files` says in as many words that `schemas=None` means
# "the tree is the manifest — right for a single-schema tree, wrong for a pooled root".
# `../BIRD-corpus` is a pooled root. Until `tools/run_datalake_eval.py` passes one, an arm declaring
# `5a556b3c…` would be refused against rows carrying `6e5c7b4b…`, so these three declare the
# whole-tree digest they will actually record. That is stricter than the assets require, never
# looser: it fails loudly when an asset changes AND when a README does. Fixing it in the driver
# alone would put a scoped digest in the eval path beside a whole-tree one in the API path, which
# is the second answer the parameter exists to prevent — so it is one change in one owner's
# hands, not this file's to make.
#
# ── three fields no arm below declares, and why ───────────────────────────────
#
# `hypothesised_effect`, `readout` and `corpus_release` are **optional**, and every arm in this
# file leaves all three blank. That is a decision, not an omission, and the loader now enforces
# the shape of it: an unrecognised key in an `[arm.*]` table is refused outright, because these
# three were fields of `ArmProfile` that `register/arm_profiles.py` never passed to it —
# nine keys against twelve fields — so writing `hypothesised_effect = 0.03` here parsed clean,
# arrived as `None`, and left `eval/provenance.py::arm_power_refusal` abstaining on every arm that
# could ever be declared. The gate that stops an underpowered paid arm was silent by construction.
# `hypothesized_effect`, the American spelling, is one keystroke from the same silence; it is now
# a load error.
#
#   hypothesised_effect  the effect the arm exists to detect, as a PROPORTION of the readout:
#                        3pp is `0.03`, and `3` is refused, because `eval/power.py::require_power`
#                        compares it against a floor that is a proportion and so a
#                        percentage-point figure clears every floor at every n. Must be strictly
#                        between 0 and 1; zero is not "no hypothesis" and is refused too.
#   readout              the quantity the effect is in, e.g. `"EX"`. Mandatory beside an effect
#                        and absent without one. It is not in the arithmetic — MDE is denominated
#                        in points of the whole population, and a mechanism indicator with a
#                        2.15pp ceiling has 1.9 resolvable steps against EX's 28.5, so a draft
#                        read the smaller MDE as the better instrument. Naming the readout is what
#                        makes that unit error visible to whoever reads the refusal.
#   corpus_release       the corpus TAG the arm was measured on, matching the `corpus_release`
#                        comparability knob. Mandatory only for an arm whose `treatment` names
#                        `corpus_release` — such an arm otherwise leaves the one field it exists
#                        to vary unchecked. A tag, not a ref and not a digest.
#
# **Why all seven arms below are blank, stated rather than left to inference.**
#
# No effect size, for the four measured arms: all four were measured before the field existed, so
# any number here would be
# read off the arm's own result. That is not a hypothesis, and it is worse than the silence in one
# specific way — a fabricated effect makes `arm_power_refusal` *pass*, where an absent one makes it
# abstain. The gate is therefore not in force on this file, which
# `tests/conformance/test_arm_profiles_are_declared.py::
# test_the_shipped_arms_declare_no_hypothesis_and_that_is_the_committed_state` asserts as an
# inventory, so the first arm to declare one has to come through that test.
#
# No effect size, for the three planned arms, which is the *harder* case because these three
# could pre-register one and are the arms the field was added for. It is left to the operator and
# is not filled in here, because the number is a claim about a population that does not exist
# yet: `docs/two-planes.md` §9 sizes the run at "the 74 questions of §1.5 plus the 49 capped,
# deduplicated, ~100 questions" — a set selected for having failed once, on which the null is not
# zero but regression to the mean at the measured 12.7% discordance. An effect size written here
# by somebody who has not seen that set would make `arm_power_refusal` **pass**, which is the one
# outcome worse than its abstaining. Whoever materialises the probe set declares the hypothesis in
# the same commit.
#
# No release: `../BIRD-corpus` carries no tags at all (checked 2026-08-24, `git tag --list` is
# empty, still true 2026-08-26). All four measured arms were measured against a working tree,
# identified by the content digest
# above, and minting a release name now to attach retroactively would be a claim about the corpus
# repository that the corpus repository does not make. The digest already reconciles the rows.
# The three planned arms leave it blank for a different reason: none of them names `corpus_release`
# in its `treatment` — the corpus is held FIXED across all three, which is what makes them a
# comparable set — so the field is optional for them, and a tag cut today would be a release name
# for a tree nobody has released. Cutting one is the follow-up that makes the digest note above
# actionable, not a precondition for these runs.

[arm.v3_fold]
description = "ANALYST v3 with the fold prompt, routing pinned."
treatment = []
corpus = "30872d3"
# Derived from the artifact, not from the corpus checkout: 1 345 of the 1 351 rows of
# `runs/eval/proxy_v3_fold_opus_high_corpus30872d3.jsonl` carry this digest and the other 6 carry
# `None` — the zero-licensed clarifications of open-work §3.6a, which never reach the stamp. It is
# the same digest v4 and v5 record, which is what a shared corpus is supposed to look like.
corpus_content_hash = "86ed1dbfef8b325e188061229b665c4918ec8c86c65e39b619a5495b0abab6d5"
# **Measured from the artifact, on 2026-08-20, not reconstructed.** The seven `proxy_*` artifacts
# in `runs/eval/` are gitignored but they are on the maintainer's machine, which the fork's
# write-up assumed they were not — so the question set did not have to be inferred. The 1 351
# `question_id` values in `runs/eval/proxy_v3_fold_opus_high_corpus30872d3.jsonl` are **set-equal**
# to the 1 351 in `BIRD-Data-Obfuscation@22fe2a6:eval_dataset/test_final.jsonl`: zero extra, zero
# missing, and those questions cover exactly the 57 schemas `BIRD-corpus@30872d3` holds, with no
# schema on either side unmatched. `423a3f4b65fb` is `short_digest` of that id set. Independent
# check on the same value: `runs/eval/live_full_gpt-5.6-luna_xhigh_topdefault_lexical.jsonl` — a
# later run, produced after `scope_identity` gained a writer — records
# `question_subset = "1351:423a3f4b65fb"` from the harness itself.
#
# The fork reached `22fe2a6` independently and by a different route (the schema-filtered count
# across four dataset versions, plus "73 declines + 1 278 committed = 1 351" from
# `docs/failure-modes.md`). Two methods, one answer; the digest here is the one read off the rows.
dataset = "22fe2a6"
question_subset = "1351:423a3f4b65fb"
notes = "The baseline v4 is measured against. Its own treatment is relative to v3, not recorded here."

[arm.v4]
description = "ANALYST v4 prompt. The arm every quoted figure in README.md comes from."
treatment = ["prompt_set"]
compare_to = "v3_fold"
corpus = "30872d3"
corpus_content_hash = "86ed1dbfef8b325e188061229b665c4918ec8c86c65e39b619a5495b0abab6d5"
# Same check, run separately against `runs/eval/proxy_v4_corpus30872d3.jsonl`: set-equal to
# `22fe2a6`'s test split, zero extra, zero missing. Not copied from v3_fold — the point of the
# field is that a shared question set is an assertion two artifacts can be found to disagree on.
dataset = "22fe2a6"
question_subset = "1351:423a3f4b65fb"

[arm.v5]
description = "v4 plus the projection ablation, which priced ~4 points of EX as shape-matching."
treatment = ["prompt_set"]
compare_to = "v4"
corpus = "30872d3"
corpus_content_hash = "86ed1dbfef8b325e188061229b665c4918ec8c86c65e39b619a5495b0abab6d5"
# Same check against `runs/eval/proxy_v5_corpus30872d3.jsonl`: set-equal, zero extra, zero missing.
dataset = "22fe2a6"
question_subset = "1351:423a3f4b65fb"

[arm.ask_first]
description = "ANALYST ask_first prompt. Off-default until a measured arm exists; serve stays v4."
treatment = ["prompt_set"]
compare_to = "v4"
corpus = "30872d3"
corpus_content_hash = "86ed1dbfef8b325e188061229b665c4918ec8c86c65e39b619a5495b0abab6d5"
dataset = "22fe2a6"
question_subset = "1351:423a3f4b65fb"

# ── the three planned arms: docs/two-planes.md §9, Arms A / B / C ──────────────
#
# **Declared before they run, which is the point and also the reason two fields below are wrong
# on purpose.** `question_subset` is mandatory, and its value cannot be known until the ~100
# question probe set exists; so each of the three declares a string that names itself unresolved
# and can match no run. `arm_startup_refusal` then refuses the arm before the first paid
# question and prints both values, and the operator pastes the recorded one back here. That is
# the check firing, not a placeholder silencing it — the alternative on offer was
# `"1351:423a3f4b65fb"`, the full split, which would have been a false claim that PASSED.
#
# The three form one comparable set only if the corpus is held fixed across them. All three
# therefore declare `74ff80c` and the digest the driver will record against it, and none names
# `corpus_release` in its treatment. If a corpus patch lands mid-experiment, the arms already
# run are not re-runnable against the arms that follow, and the digest is what says so.

[arm.v4_live]
description = "v4 unchanged, re-run on today's engine. The live control for the two arms below."
# Empty for the same reason `v3_fold`'s is: what separates this arm from `v4` is the ENGINE, and
# the engine is `git_sha`, which is `Role.operational`. There is no comparability knob that names
# "several retrieval fixes landed", so this arm cannot declare a treatment relative to `v4` and
# does not pretend to. What it can be is the control for `licensed_pre_budget`, which declares a
# real knob.
treatment = []
# **Deliberately no `compare_to = "v4"`, and this is the trap it avoids.** `v4` and this arm
# resolve every comparability knob identically — the difference is the harness commit — so
# `eval/report.py::knobs_comparable` would certify the pair, and the delta would be read as a
# treatment effect when it is the code. `docs/open-work.md` §3.13's "no pair on disk reaches the
# cross-arm gate" is about missing knobs; this is the opposite hazard, a pair that reaches the
# gate and should not. Quote this arm against the two below, never against `v4`.
corpus = "74ff80c"
# The whole-tree digest of `../BIRD-corpus` at 74ff80c, measured 2026-08-26. See the header's
# two-digests note for why it is not `5a556b3c…` (the asset-scoped digest, invariant across both
# commits) and what would have to change for it to be.
corpus_content_hash = "6e5c7b4be83d56828bab66183eec03bbdcf486d7454d34acd066530010ebed85"
# The ref the probe set is drawn from; the operator confirms it is still the checkout.
dataset = "22fe2a6"
question_subset = "unresolved: the ~100-question probe set of docs/two-planes.md 9 does not exist yet"
notes = """
Arm A. MUST run at licensed_seed_pre_budget = False: the pre-budget seed is the treatment of the \
arm below, and this arm is what it is measured against. That is a DEPARTURE from the shipped \
default, which is True as of 2026-08-26 -- so the operator passes \
`tools/run_datalake_eval.py --post-budget-licence`, which writes the override into \
`knobs_resolved` and adds `_postbudget` to the artifact name. Running this arm without it \
produces a replicate of Arm B wearing the control's name, and no gate can see that: the two \
would agree on every comparability knob, which is exactly what `knobs_comparable` reads as \
"nothing changed".

`treatment` stays empty even though this arm pins a knob. The field says what an arm changed \
relative to its control, and this arm has no control -- it IS one. The knob is named by \
`[arm.licensed_pre_budget]` below, which is the arm that moves it.
"""

[arm.licensed_pre_budget]
description = "v4_live plus `licensed` seeded from the pre-budget table set."
# The knob was declared with this arm, and the arm is why it must exist. An unconditional code
# change would leave this arm and `v4_live` resolving every comparability knob identically, so
# `knobs_comparable` would compare them on 50 matching values, find no difference, and certify a
# pair whose only difference is one it cannot see. The knob is what makes the treatment nameable
# — and `check_declared_is_consumed.py` rule K1 is what says whether anything reads it. It said
# nothing did until 2026-08-26, when `serve/nodes/route_retrieve.py::_licensable_tables` began
# reading it; this arm runs at the shipped default and `v4_live` is the one that pins.
treatment = ["licensed_seed_pre_budget"]
compare_to = "v4_live"
corpus = "74ff80c"
corpus_content_hash = "6e5c7b4be83d56828bab66183eec03bbdcf486d7454d34acd066530010ebed85"
dataset = "22fe2a6"
question_subset = "unresolved: the ~100-question probe set of docs/two-planes.md 9 does not exist yet"
notes = """
Arm B. On the branch where this beats Arm A, docs/two-planes.md §9 records what follows: the \
one-line seeding fix was the cause, and the rewrite's accuracy case is spent. The population is \
selected for having failed once, so ~20 of ~100 flip to correct on a re-run of the identical \
configuration; that regression-to-the-mean null, not zero, is what a win has to beat.
"""

[arm.licensed_pre_budget_cap10]
description = "licensed_pre_budget plus attempt cap 10, with the node budget raised to match."
# Two names because two knobs move, and the second is not optional. `run_query_attempt_cap` alone
# at 10 puts 10 x 120s = 1200s of statement timeout against a 1200s node budget, so the five
# extra attempts convert to `crashed` rather than to recoveries and the arm reads as evidence
# that a higher cap does not help. `register/knobs.py::attempt_cap_pairing_problem` refuses that
# configuration at import; raising `agent_node_timeout_s` to >= 2400s is what clears it, and both
# knobs are `Role.comparability`, so both belong here or `knobs_comparable` compares the arm
# against its control on a value that moved.
treatment = ["run_query_attempt_cap", "agent_node_timeout_s"]
compare_to = "licensed_pre_budget"
corpus = "74ff80c"
corpus_content_hash = "6e5c7b4be83d56828bab66183eec03bbdcf486d7454d34acd066530010ebed85"
dataset = "22fe2a6"
question_subset = "unresolved: the ~100-question probe set of docs/two-planes.md 9 does not exist yet"
notes = """
Arm C. Compared against Arm B and not against Arm A, because licence width and attempt cap are \
separate treatments and an arm that moves both cannot attribute its own delta. The cap number is \
not arbitrary: ReAct-SQL caps at 15 and observes no query above 13, so 5 truncates the tail \
rather than bounding it. `run_query_attempt_cap` has no env_var, so raising it means editing the \
register default -- which is exactly where the import-time pairing check is waiting.
"""
