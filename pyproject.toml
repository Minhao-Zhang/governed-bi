[project]
name = "governed-bi"
version = "0.1.0"
description = "Agentic BI: natural-language questions to grounded, governed, auditable answers over relational data."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Minhao Zhang" }]
# Core + agent deps live here: a plain `uv sync` installs everything the default
# OpenAI-backed stack needs, so dev never hits a "feature silently off because its
# extra wasn't installed" bug. There is exactly **one** extra, `bedrock`, and it is
# the only thing a base install leaves out; see [project.optional-dependencies].
#
# This paragraph read "There are **no extras**" until 2026-08-09, and it was wrong
# for days. The extra really was removed on 2026-08-04 (it fronted
# `model/bedrock_embedder.py`, which was absent then), and it came back when
# multi-provider support landed and that module with it — but the note stayed, and
# README.md and docs/usage.md had copied it. Someone following them skipped a
# dependency CI installs (`uv sync --frozen --extra bedrock`), so the provider
# translation tests skipped on their machine and ran on CI's.
#
# Every entry below is imported by something under `src/` or `tests/`, checked by
# grep on the same date. Four were not and are gone; see the git log for the reasoning
# on `deepagents` in particular, which is retired rather than deferred.
dependencies = [
    # --- Core engine (deterministic) ---
    # Corpus asset schemas (Facts / Inference / Audit tiers) and validation; also
    # `serve/scripted_model.py`'s recording fields, which are pydantic fields because
    # `BaseChatModel` is a pydantic model.
    "pydantic>=2.7",
    # YAML typed assets are the source of truth (D9).
    "pyyaml>=6.0",
    # SQL parsing for every layer of the governance stack (ADR 0006).
    # Upper bound pins the generation, and it is a security pin, not hygiene: the
    # function allowlist in `govern/functions.py` is keyed on sqlglot expression
    # CLASSES and matched on their canonical names, both of which move across
    # majors — `json_agg` parses to `exp.JSONArrayAgg`, whose canonical name is
    # `J_S_O_N_ARRAY_AGG`, and `exp.And`/`exp.Or`/`exp.Exists` are `exp.Func`
    # subclasses in 30.x. A silent major upgrade would change what the allowlist
    # matches with no test failing on the way past. `sqlglot_version` is also a
    # comparability knob (ADR 0006 §13), and `govern.functions` raises at import if
    # the installed major is not the one the list was enumerated against.
    "sqlglot>=30.12,<31",
    # --- DB connectors (Postgres + Redshift both ride psycopg; drivers lazy-imported) ---
    "psycopg[binary]>=3.1",
    # --- HTTP JSON API (governed_bi.api) the frontend consumes ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # --- LLM + embedding seams, OpenAI-backed ---
    # Nothing imports `openai` directly — `langchain-openai` does. Declared anyway, and
    # only for the floor: `use_responses_api` needs a client recent enough to have the
    # Responses API, and that requirement belongs where a reader can see it.
    "openai>=1.40",
    # --- Agent harness: LangGraph server + LangChain clients ---
    # Upper bounds pin the wire-protocol generation this repo was built against
    # (see docs/architecture.md §9). Transitive langgraph-api / langgraph-sdk are
    # constrained under [tool.uv] rather than declared as direct deps.
    "langgraph>=1.0,<2",
    "langgraph-cli[inmem]>=0.4,<0.5",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    # No `langchain-aws` here: it pulls a boto3/botocore tree that the OpenAI and proxy arms
    # never touch, and the base install is what every model-free test runs against. It is an
    # extra — `uv sync --extra bedrock` — and every import of it is inside the function that
    # needs it, so selecting a non-Bedrock provider never pays for it. See
    # [project.optional-dependencies].
    # No `langgraph-checkpoint-sqlite` / `-postgres`: zero importers. `InMemorySaver` is
    # the only saver compiled in-tree (`/chat`); LangGraph Server injects its own for the
    # stream path. ADR 0004's durable checkpointer half did not ship — `/capabilities`
    # reports `checkpoint_durable: false`. Declaring a dependency for an unbuilt saver
    # would advertise a capability nobody built.
    #
    # No `deepagents`: zero importers, and **retired rather than deferred.**
    # `FilesystemMiddleware` contributes `write_file` / `edit_file` and they are not
    # removable, which is exactly the generic write channel that let v1 forge
    # `source=human, status=certified` on curated assets. This repository's rule is that
    # the governance boundary is enforced by the *absence* of a tool (ADR 0006), so a
    # harness that mandates one is not a harness we can adopt. Its
    # `TodoListMiddleware` also costs three super-steps per sequential tool call, which
    # is what silently dropped 30 of 57 schemas from a paid curator run. A LangGraph
    # `StateGraph` with one `create_agent` node is the alternative, and `serve/` is
    # already built that way.
    # --- Tracing: none. LangSmith is the only tracer and it is env-native — it
    # rides langchain-core's own `langsmith` dependency and needs no declaration
    # here. Langfuse (a `langfuse>=3.0` direct dep) was removed on 2026-08-02.
    # --- Vector storage: every cosine in the system runs here ---
    # `retrieve/vectors.py` replaced an 848 MB JSON cache that cost 21.7 s to parse and
    # 1.7 GB resident at every server start.
    "lancedb>=0.36.0",
    # Declared even though `lancedb` already installs it, because `retrieve/vectors.py`
    # imports it **directly** — the schema, the `FixedSizeListArray` and the row-index `take`
    # that moves 13,968 vectors between stores without decoding them into Python floats. An
    # import whose package is only present as somebody else's transitive dependency is one a
    # minor release of that dependency can remove.
    "pyarrow>=25.0",
    # No `numpy`. It arrives under `lancedb` and nothing in `src/` or `tests/` imports it;
    # the dev group's note on why it was removed is about declared dependencies and holds.
]

[project.optional-dependencies]
# AWS Bedrock, for both the chat surfaces and the embedder. `uv sync --extra bedrock`.
# `langchain-aws` brings boto3/botocore transitively; both are named so the floor is visible
# to a reader — `botocore.config.Config` is what carries the timeout and retry knobs onto a
# Bedrock client, and `model/provider.py` imports it directly.
bedrock = [
    "langchain-aws>=1.0",
    "boto3>=1.34",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    # Test-order independence is a property this suite relies on (fixtures share a
    # scratch dir, several tests monkeypatch module globals) and nothing checked it —
    # it was only ever verified by a reviewer pulling the plugin in ad hoc.
    "pytest-randomly>=3.15",
    # Optional local/CI coverage runs (`uv run pytest --cov=governed_bi`); not gated.
    "pytest-cov>=5.0",
    # No `httpx` and no `numpy`. Both were declared for a named consumer that does not
    # exist: `TestClient` appears nowhere in `tests/` (the API is tested through its
    # shaping functions, because the routes build a Postgres connector), and
    # `DeterministicFakeEmbedding` appears nowhere either — `model/deterministic_embedder.py`
    # is ours and imports no numpy. A dependency justified by a comment naming a caller
    # is only as true as the caller.
    "ruff>=0.16.0",
    "mypy>=2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/governed_bi"]

# Wire-protocol packages owned by the LangGraph Server stack arrive only as
# transitive deps of langgraph-cli[inmem]. Pin them here so `uv sync -U` cannot
# silently move /threads, /runs/stream, or stream_subgraphs without a deliberate
# pyproject change. See docs/architecture.md §9.
#
# **Moved 0.11 -> 0.12 on 2026-08-05, which is what this pin is for.** The server
# announced `langgraph-api 0.11.0 is in Critical support` — a support *tier*, meaning
# only critical fixes land, and not a published vulnerability: OSV has no advisory for
# `langgraph-api` at any version, nor for `langgraph` 1.2.8. So this is a lifecycle
# upgrade, not a patch, and it was taken deliberately rather than by `-U` drifting.
#
# The bump was verified against the three behaviours this repository actually depends on
# and that a wire-protocol minor could break silently, because none of them fails loudly:
# `stream_subgraphs` carrying custom events *and* tokens (ADR 0010 M2 — without it the
# timeline is empty and the server still answers 200), the checkpointer reaching the
# nested `create_agent` through config (which is what makes `ask_user` resumable and
# `/threads` persist), and `http.app` mounting the custom routes.
[tool.uv]
constraint-dependencies = [
    "langgraph-api>=0.12,<0.13",
    "langgraph-sdk>=0.4.2,<0.5",
]

# --- Tooling (AUDIT T5) -------------------------------------------------------
# Config lands here so local runs and CI share one source of truth. `ruff check` is
# green on the whole tree and CI gates it. `mypy` is installed and configured but
# gated only over the governance-critical modules (see [tool.mypy] below) — a clean
# pass over all ~32k LOC is a separate effort, and a gate nobody can keep green is
# worse than an honest narrow one. Coverage is available via pytest-cov, not gated.

[tool.pytest.ini_options]
# --strict-markers: a typo'd mark (e.g. skipiff) fails loudly instead of no-op.
# -ra is opt-in on CLI (CI already uses -rs); keep addopts focused on correctness.
addopts = ["--strict-markers"]
filterwarnings = [
    # The suite's 131 `ResourceWarning: unclosed database` (AUDIT T5) were all one
    # bug: `with sqlite3.connect(...)` commits but does not close. Fixed at the four
    # run_log.py sites; now an error so the trap cannot come back silently.
    "error::ResourceWarning",
]

[tool.ruff]
target-version = "py313"
# 120, not 100: the tree was written without a formatter and its longest line is 119.
# Picking the limit the code already respects makes the gate enforceable today rather
# than aspirational. Tighten with a formatting pass, not by leaving the gate off.
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
# Starter select only — expand alongside the cleanup, never ahead of it.
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.13"
# `uv run mypy src` checks the whole tree (~89 findings, mostly Optional narrowing) —
# useful locally. CI gates a named subset: the governance spine (what decides whether
# a query executes) plus the eval register/harness/split-gap modules (what decides
# whether a number is comparable and quotable). The file list lives in
# .github/workflows/ci.yml so widening it is a visible, reviewable change.
packages = ["governed_bi"]
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
