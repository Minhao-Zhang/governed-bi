[project]
name = "governed-bi"
version = "0.1.0"
description = "Agentic BI: natural-language questions to grounded, governed, auditable answers over relational data."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Minhao Zhang" }]
# Core + agent deps live here (no extra): a plain `uv sync` installs everything the
# default OpenAI-backed stack needs, so dev never hits a "feature silently off
# because its extra wasn't installed" bug (e.g. Langfuse tracing). The one extra is
# `bedrock` (AWS Bedrock provider) — an alternate LLM/embedding backend that pulls a
# heavy boto3 tree most runs don't need. See [project.optional-dependencies].
dependencies = [
    # --- Core engine (deterministic) ---
    # Corpus asset schemas (Facts / Inference / Audit tiers) and validation.
    "pydantic>=2.7",
    # YAML typed assets are the source of truth (D9).
    "pyyaml>=6.0",
    # In-memory property graph + Steiner-tree join planning (BIRD scale).
    "networkx>=3.3",
    # SQL parsing for the AST column-allowlist guardrail (analyst L3).
    "sqlglot>=25.0",
    # --- DB connectors (Postgres + Redshift both ride psycopg; drivers lazy-imported) ---
    "psycopg[binary]>=3.1",
    # --- HTTP JSON API (governed_bi.api) the frontend consumes ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # --- LLM + embedding seams (governed_bi.llm), OpenAI-backed ---
    "openai>=1.40",
    # --- Agent harnesses: LangGraph server DAG + deepagents curator + LangChain clients ---
    "langgraph>=1.0",
    "langgraph-cli[inmem]>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "deepagents>=0.6",
    # --- External tracing (Langfuse callback; LangSmith is env-native, no dep) ---
    "langfuse>=3.0",
]

[project.optional-dependencies]
# AWS Bedrock LLM + embedding provider. Opt in with `uv sync --extra bedrock`
# (or `pip install 'governed-bi[bedrock]'`), then set provider = "bedrock" in the
# [models] table. langchain-aws pulls boto3, hence keeping it out of the default
# install. Credentials come from boto3's standard chain (env / profile / role).
bedrock = [
    "langchain-aws>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    # Test-order independence is a property this suite relies on (fixtures share a
    # scratch dir, several tests monkeypatch module globals) and nothing checked it —
    # it was only ever verified by a reviewer pulling the plugin in ad hoc.
    "pytest-randomly>=3.15",
    # Optional local/CI coverage runs (`uv run pytest --cov=governed_bi`); not gated.
    "pytest-cov>=5.0",
    # Starlette's TestClient (used by the API tests) needs httpx.
    "httpx>=0.27",
    # LangChain's DeterministicFakeEmbedding (used by the LangChainEmbedder tests)
    # imports numpy; it is not a hard langchain-core dependency, so pin it here for
    # the test environment (previously satisfied transitively via streamlit).
    "numpy>=1.26",
    "ruff>=0.16.0",
    "mypy>=2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/governed_bi"]

# --- Tooling (AUDIT T5) -------------------------------------------------------
# Config lands here so local runs and CI share one source of truth. `ruff check` is
# green on the whole tree and CI gates it. `mypy` is installed and configured but
# gated only over the governance-critical modules (see [tool.mypy] below) — a clean
# pass over all ~32k LOC is a separate effort, and a gate nobody can keep green is
# worse than an honest narrow one. Coverage is available via pytest-cov, not gated.

[tool.pytest.ini_options]
# --strict-markers: a typo'd mark (e.g. skipiff) fails loudly instead of no-op.
# -ra is opt-in on CLI (CI already uses -rs); keep addopts focused on correctness.
addopts = ["--strict-markers"]
filterwarnings = [
    # The suite's 131 `ResourceWarning: unclosed database` (AUDIT T5) were all one
    # bug: `with sqlite3.connect(...)` commits but does not close. Fixed at the four
    # run_log.py sites; now an error so the trap cannot come back silently.
    "error::ResourceWarning",
]

[tool.ruff]
target-version = "py313"
# 120, not 100: the tree was written without a formatter and its longest line is 119.
# Picking the limit the code already respects makes the gate enforceable today rather
# than aspirational. Tighten with a formatting pass, not by leaving the gate off.
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
# Starter select only — expand alongside the cleanup, never ahead of it.
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.13"
# `uv run mypy src` checks the whole tree (~89 findings, mostly Optional narrowing) —
# useful locally. CI gates the governance spine only; the file list lives in
# .github/workflows/ci.yml so widening it is a visible, reviewable change.
packages = ["governed_bi"]
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
