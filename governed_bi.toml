# Reference / aspirational config. NOT loaded by src/ today.
# Live config: GOVERNED_BI_* env vars + register/knobs.py defaults.
# Secrets never belong here — only env-var *names*.

[runtime]
environment = "dev"

[paths]
corpus_root = "../BIRD-corpus"

[models]
provider = "openai"
llm_model = "gpt-5.6-luna"
llm_reasoning_effort = "low"  # none | low | medium | high | xhigh | max
embedding_model = "text-embedding-3-large"
api_key_env = "OPENAI_API_KEY"

[datasource]
kind = "sqlite"  # sqlite | postgres | redshift
corpus_pin = "beer_factory"
sqlite_path = "data/bird/beer_factory.sqlite"

[serve]
can_stream = false
allow_edit = false
cors_origins = ["http://localhost:3000"]

[notes]
always_note_global_max = 8
always_note_char_max = 2000
pin_triggers_enabled = false
pin_require_certified = true
pin_max = 3

[eval]
workers = 1

[routing]
top_k = 10
llm_pick = true
pick_max_columns = 12
