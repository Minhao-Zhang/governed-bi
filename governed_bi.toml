# Project-level configuration for governed-bi.
#
# One source of truth for all non-secret policy, parsed by
# governed_bi.config.load_settings(). Local overrides go in the git-ignored
# governed_bi.local.toml beside this file (same tables; local wins on merge).
#
# SECURITY: never put an API key or DSN password in this file. Secrets live in
# the environment (or a git-ignored .env). This file only names the env var
# ([models].api_key_env, [datasource].dsn_env).

[runtime]
# dev  = BIRD scale: auto-accept corpus, single all-access identity, hard-block
#        suspect columns, files + SQLite.
# prod = enterprise *intent* (PR + owner + CI, real user + gateway RLS, soft-warn).
# WARNING: environment = "prod" is NOT bootable in this demo repo. Settings.for_env
# sets single_all_access_identity=False, and build_stack() then raises
# NotImplementedError (per-user identity + gateway RLS live in the enterprise
# fork, D1/D7). Keep "dev" here, or override single_all_access_identity = true
# if you need prod-ish toggles without that identity path.
environment = "dev"
# Optional per-toggle overrides (otherwise follow environment defaults above):
# auto_accept_corpus = true
# single_all_access_identity = true
# hard_block_suspect_columns = true

[paths]
# Corpus root (D9/D13). Relative values resolve against the repo root, not CWD,
# so a sibling checkout works as corpus_root = "../BIRD-corpus".
corpus_root = "corpus"

[models]
# Provider-agnostic by shape; OpenAI by current project decision.
provider = "openai"

# LLM used by the curator proposer and the server SQL generator.
# gpt-5.6-luna = GPT-5.6 Luna tier (account must have access; else 404).
# Fall back to gpt-5.5 if your account is GA-only.
llm_model = "gpt-5.6-luna"
llm_reasoning_effort = "low" # none | low | medium | high | xhigh | max
# llm_max_output_tokens = 4096   # omit for provider default

# Embedding model for the retrieval vector channel.
# The search space is small, so a compact model is enough; swap freely.
embedding_model = "text-embedding-3-small"
# embedding_dimensions = 1536    # omit for model default

# Environment variable that holds the API key (the key itself never lives here).
api_key_env = "OPENAI_API_KEY"

# To run on AWS Bedrock instead, install the extra (`uv sync --extra bedrock`) and
# switch the provider — typically in the git-ignored governed_bi.local.toml:
#   [models]
#   provider = "bedrock"
#   llm_model = "us.anthropic.claude-sonnet-4-5-20250929-v1:0"  # Bedrock model id
#   embedding_model = "amazon.titan-embed-text-v2:0"            # Bedrock embedding id
#   region = "us-east-1"                                        # omit for AWS_REGION default
#   api_key_env = "AWS_BEARER_TOKEN_BEDROCK"  # any var that must be set to go live;
#                                             # boto3 also honors AWS_ACCESS_KEY_ID / profile / role

[datasource]
# Which database the engine + curator read. Default: the vendored SQLite fixture
# (data/bird/beer_factory.sqlite) — a DEMO / TEST fixture only, so the offline demo
# and CI need no setup. For real work, do NOT build on beer_factory: override this
# table in a git-ignored governed_bi.local.toml to point at your own DB, and author
# a corpus for that schema. Built into a Connector by gateway.build_connector; the
# corpus itself has no build CLI — curator/pipeline.py's build_baseline_corpus /
# build_curated_corpus are library calls, driven today only by the eval drivers
# (governed_bi.eval.run_experiment / run_datalake). `python -m governed_bi.corpus.cli`
# only validates an already-authored corpus, it does not author one.
kind = "sqlite"                               # sqlite | postgres | redshift
corpus_pin = "beer_factory"                   # default corpus schema subtree / BIRD db_id
# db = "main"                                 # lake identity for db: note scopes (ADR 0003);
#                                             # distinct from corpus_pin / schema
sqlite_path = "data/bird/beer_factory.sqlite" # repo-root-relative

# To profile a BIRD-Obfuscation Postgres instance instead (e.g. the renamed+decoy
# one), put the switch in governed_bi.local.toml (git-ignored) and the DSN
# password in .env. Example local overlay:
#   [datasource]
#   kind = "postgres"
#   corpus_pin = "beer_factory"
#   dsn_env = "PG_RENAME_DECOY_DSN"
# The engine is uniformly schema-qualified (D15). Leave `schema` unset to span all
# user schemas; pin one to scope a single db_id (bare refs then resolve to it).
#   # schema = "beer_factory"

[serve]
# Capability flags the API / frontend adapt to.
# can_stream: REST factory default. The LangGraph-mounted app (api/routes.py)
# forces can_stream=True regardless of this value.
can_stream = false
# Corpus file-write (POST /corpus/edit). Safe default is false. for_env(dev)
# opts in when this key is omitted; set true in governed_bi.local.toml for
# local demo edits. Mutating routes also require auth when api_key_env is set.
allow_edit = false
# Env-var *name* for the shared HTTP API secret (X-API-Key or Bearer).
# Unset = single-identity demo: reads stay open; writes still need allow_edit.
# api_key_env = "GOVERNED_BI_API_KEY"
cors_origins = ["http://localhost:3000"]

# Memory / cache / few-shot numeric gates (docs/architecture.md §7) are design
# targets in that doc only — this branch removed them from Settings, so there is
# no knob here or in code to tune yet.

# Conversation checkpointer + portable run-log knobs (ADR 0004). Defaults match
# Settings; uncomment to override. DSN passwords never live here — only the env
# var name.
# [logging]
# conversation_checkpointer_kind = "sqlite"   # sqlite | postgres | memory
# conversation_checkpointer_path = "data/checkpoints/conversations.sqlite"
# conversation_checkpointer_dsn_env = "CHECKPOINT_DSN"  # postgres only; never inline DSN
# run_log_kind = "sqlite"                     # sqlite | jsonl | off
# run_log_path = "data/logs/runs.sqlite"

# Which registered prompt variant each stage sends (the governed_bi.prompts
# registry). Omitted = every stage on v1, byte-identical to the text this system
# has always sent. A stage or variant this build does not know fails at startup
# rather than falling back to v1: a run must never report a prompt it did not
# send. Read src/governed_bi/prompts/registry.py for the stage list and each
# variant's rationale. The eval CLIs take --prompt stage=variant for one-offs.
# [prompts]
# schema_pick = "v2"
# agent_core = "v3"

[eval]
# BIRD eval-harness concurrency (docs/measurement.md).
# workers = serve-loop worker threads for run_experiment / run_datalake. 1 is the
# non-negotiable default: fully serial, byte-identical to the pre-concurrency run.
# Raise it on a dedicated box with no rate limits; size to your Postgres
# max_connections (each worker holds its own connection). --workers on either CLI
# overrides this. serve_workers/build_workers are optional splits: serve_workers
# sizes the per-question serve loop, build_workers the per-schema corpus build loop.
# Both are live — the build loop runs a thread pool with a staging root per schema,
# and the runbook's own Step 2 command passes --build-workers 6.
workers = 1
# serve_workers = 1
# build_workers = 1   # per-schema corpus builds; each gets its own staging root

# Optional eval routing profile (D15 schema router). Distinct from product
# dataclass defaults (shortlist@3, no LLM pick). Uncomment to pin a deployment
# to the same knobs the pooled data-lake driver uses by default. Omit this
# table (or leave it commented) for product defaults. CLI flags still override
# for a one-off run.
# [routing]
# top_k = 10
# llm_pick = true
# pick_max_columns = 12
